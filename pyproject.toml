[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regextree"
version = "0.1.0"
description = "Interpretable text categorization using LLM-generated regex patterns in a boosting framework"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
